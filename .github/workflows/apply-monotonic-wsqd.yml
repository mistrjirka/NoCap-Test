name: Diagnose monotonic WSqD payload

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/monotonic-wsqd
          fetch-depth: 0

      - name: Record payload diagnostics
        shell: bash
        run: |
          set +e
          diagnostics=.scheduler-upload/diagnostics.txt
          {
            echo 'files:'
            find .scheduler-upload -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            echo
            echo 'hashes:'
            sha256sum .scheduler-upload/part-* 2>&1
          } > "$diagnostics"
          cat .scheduler-upload/part-* | base64 --decode > /tmp/monotonic-wsqd.tar.gz 2>> "$diagnostics"
          decode_rc=$?
          {
            echo
            echo "base64_decode_rc=$decode_rc"
            if [ -f /tmp/monotonic-wsqd.tar.gz ]; then
              sha256sum /tmp/monotonic-wsqd.tar.gz
              gzip -t /tmp/monotonic-wsqd.tar.gz
              echo "gzip_test_rc=$?"
              tar -tzf /tmp/monotonic-wsqd.tar.gz
              echo "tar_list_rc=$?"
            fi
          } >> "$diagnostics" 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$diagnostics"
          git commit -m 'Record WSqD payload diagnostics' || true
          git push origin HEAD:agent/monotonic-wsqd
          test "$decode_rc" -eq 0
          gzip -t /tmp/monotonic-wsqd.tar.gz
