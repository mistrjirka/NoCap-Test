name: Apply monotonic WSqD implementation

on:
  push:
    branches:
      - agent/monotonic-wsqd
    paths:
      - .scheduler-upload/**
      - .github/workflows/apply-monotonic-wsqd.yml
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/monotonic-wsqd
          fetch-depth: 0

      - name: Verify and extract staged source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/chunks.sha256 <<'EOF'
          a051726fa2bc9a0fa70ad45a66a74e04f8f31a8d30af62d7ed411c3cfa2f6a74  .scheduler-upload/part-00
          df08619a4551a7f7a32af2d46193f0376cea7b534421d18aff2fe48fb43e9ed1  .scheduler-upload/part-01
          3f934fd07898b5a3ad88a2bb85ca0bf23e04bc38ebb10ceea459e79a795d2d1d  .scheduler-upload/part-02
          e90f11459e0098cae0330cb21ccab7bfc801a92868ff5a3e7768c2ef22a5a543  .scheduler-upload/part-03
          dc95cc1014d30f386d68d1955baf51c4388be5ccf2cb0165b99e045d8439559d  .scheduler-upload/part-04
          66125b62bf470f317b9f173f7d0fa0338dc8118694a09364969bf84bcea439d0  .scheduler-upload/part-05
          03c55d2758d19b1baac710e656d309a5f5e7cf6b616726a141002274b2ee1ca5  .scheduler-upload/part-06
          EOF
          sha256sum --check /tmp/chunks.sha256
          cat .scheduler-upload/part-* | base64 --decode > /tmp/monotonic-wsqd.tar.gz
          echo '94ab4a5e605080845034099eca1a952d648765061fb88ed7f9a19988dfd0a4e2  /tmp/monotonic-wsqd.tar.gz' | sha256sum --check
          tar -tzf /tmp/monotonic-wsqd.tar.gz
          tar -xzf /tmp/monotonic-wsqd.tar.gz

      - name: Validate scheduler implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet rich
          python -m py_compile \
            training/lr_scheduler.py \
            training/cli.py \
            training/display.py \
            training/loop.py \
            scheduler_test.py
          python scheduler_test.py
          bash -n \
            scripts/run_wsqd_probe_3090.sh \
            scripts/run_loss_aware_wsqd_probe_3090.sh \
            scripts/run_wsqd_3090.sh \
            scripts/run_loss_aware_wsqd_3090.sh \
            scripts/run_wsqd_probe_v100.sh \
            scripts/run_loss_aware_wsqd_probe_v100.sh \
            scripts/run_wsqd_v100.sh \
            scripts/run_loss_aware_wsqd_v100.sh

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .scheduler-upload .patch-upload .github/workflows/apply-monotonic-wsqd.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add monotonic WSqD schedulers'
          git push origin HEAD:agent/monotonic-wsqd
